<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="cv-page-title">CV — Sirajul Islam</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📄</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{font-family:'Inter',sans-serif;background:#08141c;color:#e8f4f8;min-height:100vh}
#cursor-dot,#cursor-ring{display:none}

.cv-print-actions{position:sticky;top:0;z-index:100;background:rgba(4,12,18,.95);backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,180,200,.18);padding:.85rem 2rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.cv-back{display:inline-flex;align-items:center;gap:.4rem;font-size:.82rem;color:#a0c8d0;text-decoration:none;padding:.4rem .9rem;border:1px solid rgba(0,180,200,.2);border-radius:8px;transition:all .2s}
.cv-back:hover{color:#00d4e8;border-color:rgba(0,212,232,.4)}
.cv-title-bar{font-family:'Sora',sans-serif;font-size:.88rem;color:#5a8090}
.cv-download-btn{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.6rem;border-radius:10px;background:linear-gradient(135deg,#006466,#0b525b);border:1px solid rgba(0,212,232,.3);color:#00d4e8;font-size:.88rem;font-weight:600;cursor:pointer;transition:all .2s;box-shadow:0 4px 20px rgba(0,100,102,.4)}
.cv-download-btn:hover{transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,100,102,.55)}

.cv-page{max-width:900px;margin:2rem auto;padding:0 1.5rem 4rem}
.cv-sheet{display:grid;grid-template-columns:260px 1fr;border-radius:16px;overflow:hidden;box-shadow:0 20px 80px rgba(0,0,0,.6);border:1px solid rgba(0,180,200,.2)}

.cv-sidebar{background:linear-gradient(180deg,#065a60 0%,#0b525b 50%,#144552 100%);padding:2.5rem 1.8rem;display:flex;flex-direction:column;gap:2rem}
.cv-avatar{width:110px;height:110px;border-radius:50%;background:rgba(0,212,232,.15);border:3px solid rgba(0,212,232,.4);margin:0 auto; margin-bottom:1rem;display:flex;align-items:center;justify-content:center;font-size:3rem;overflow:hidden}
.cv-avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.cv-sidebar-name{text-align:center;font-family:'Sora',sans-serif;font-size:1.15rem;font-weight:700;color:#e8f4f8;margin-top:-.5rem}
.cv-sidebar-role{text-align:center;font-size:.75rem;color:rgba(0,212,232,.8);letter-spacing:.1em;text-transform:uppercase;margin-top:.25rem}
.cv-sidebar-section{border-top:1px solid rgba(255,255,255,.1);padding-top:1.2rem}
.cv-sidebar-h{font-family:'Sora',sans-serif;font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#00d4e8;margin-bottom:.9rem}
.cv-contact-item{display:flex;align-items:flex-start;gap:.55rem;margin-bottom:.65rem;font-size:.78rem;color:rgba(232,244,248,.8)}
.cv-contact-icon{font-size:.85rem;flex-shrink:0;margin-top:.05rem}
.cv-contact-link{color:rgba(232,244,248,.8);text-decoration:none;font-size:.75rem;word-break:break-all}
.cv-contact-link:hover{color:#00d4e8}
.cv-skill-item{margin-bottom:.7rem}
.cv-skill-label{font-size:.75rem;color:rgba(232,244,248,.8);margin-bottom:.3rem;display:flex;justify-content:space-between}
.cv-skill-pct{color:rgba(0,212,232,.8)}
.cv-skill-bar{height:3px;background:rgba(255,255,255,.1);border-radius:99px}
.cv-skill-fill{height:100%;background:linear-gradient(90deg,#006466,#00d4e8);border-radius:99px}
.cv-lang-item{font-size:.78rem;color:rgba(232,244,248,.8);margin-bottom:.4rem;display:flex;justify-content:space-between}
.cv-lang-level{font-size:.7rem;color:rgba(0,212,232,.7)}
.cv-interest-chips{display:flex;flex-wrap:wrap;gap:.4rem}
.cv-chip{font-size:.68rem;padding:.2rem .6rem;background:rgba(0,212,232,.1);border:1px solid rgba(0,212,232,.22);border-radius:99px;color:rgba(0,212,232,.85)}
.cv-main{background:#0a1822;padding:2.5rem 2.2rem}
.cv-section{margin-bottom:2rem}
.cv-section:last-child{margin-bottom:0}
.cv-h2{font-family:'Sora',sans-serif;font-size:.65rem;letter-spacing:.22em;text-transform:uppercase;color:#00d4e8;margin-bottom:1rem;display:flex;align-items:center;gap:.6rem}
.cv-h2::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,rgba(0,212,232,.3),transparent)}
.cv-summary{font-size:.88rem;color:#a0c8d0;line-height:1.78}
.cv-entry{margin-bottom:1.2rem}
.cv-entry-header{display:flex;justify-content:space-between;align-items:flex-start;flex-wrap:wrap;gap:.3rem}
.cv-entry-title{font-family:'Sora',sans-serif;font-size:.95rem;font-weight:700;color:#e8f4f8}
.cv-entry-date{font-size:.72rem;color:#00d4e8;white-space:nowrap}
.cv-entry-org{font-size:.8rem;color:#00a8b4;margin:.15rem 0}
.cv-entry-desc{font-size:.82rem;color:#7aaabb;line-height:1.7;margin-top:.3rem}
.cv-entry-bullets{margin-top:.4rem;padding-left:1rem}
.cv-entry-bullets li{font-size:.8rem;color:#7aaabb;line-height:1.65;margin-bottom:.2rem;list-style:disc}
.cv-tools{display:flex;flex-wrap:wrap;gap:.4rem}
.cv-tool{font-size:.78rem;padding:.28rem .7rem;background:rgba(0,100,102,.15);border:1px solid rgba(0,180,200,.2);border-radius:6px;color:#7aaabb}

@media print{
  body{background:#fff!important;color:#000!important}
  .cv-print-actions{display:none!important}
  .cv-page{margin:0!important;padding:0!important;max-width:100%!important}
  .cv-sheet{box-shadow:none!important;border:none!important;border-radius:0!important;min-height:100vh}
  .cv-sidebar{background:#065a60!important;-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important}
  .cv-main{background:#fff!important}
  .cv-entry-title,.cv-summary,.cv-entry-desc,.cv-entry-bullets li,.cv-h2{color:inherit!important}
}
</style>
</head>
<body>
<div id="cursor-dot"></div><div id="cursor-ring"></div>

<div class="cv-print-actions">
  <div style="display:flex;align-items:center;gap:.8rem">
    <a href="javascript:window.close()" class="cv-back">← Close</a>
    <span class="cv-title-bar" id="cv-action-title">Curriculum Vitae</span>
  </div>
  <button class="cv-download-btn" onclick="window.print()">⬇ Download PDF</button>
</div>

<div class="cv-page">
  <div id="cv-container"></div>
</div>

<script src="../js/data.js"></script>
<script src="../js/render.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  const name = SiteData.personal.name;
  document.title = 'CV — ' + name;
  document.getElementById('cv-action-title').textContent = 'Curriculum Vitae — ' + name;
});
if (new URLSearchParams(window.location.search).get('print') === '1')
  window.addEventListener('load', () => setTimeout(() => window.print(), 600));
</script>
</body>
</html>
